<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
    }
    .status {
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 16px;
    }
    .status.connected {
      background-color: #d4edda;
      color: #155724;
    }
    .status.disconnected {
      background-color: #f8d7da;
      color: #721c24;
    }
    .did {
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      background: #f5f5f5;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Trust Sidecar</h1>
  <div id="status" class="status">Checking connection...</div>
  <div id="did" class="did">Loading DID...</div>
  <button id="refresh">Refresh</button>
  
  <script src="popup.js"></script>
</body>
</html>
